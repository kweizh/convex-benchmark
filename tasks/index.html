nConvex allows scheduling functions to run on a recurring basis using cron jobs. You need to implement a scheduled cleanup job to delete expired session data.\n\n## Requirements\n- Initialize a Convex project in `/home/user/project`.\n- Define a `sessions` table in `convex/schema.ts` with fields: `sessionId` (string) and `expiresAt` (number).\n- Create a mutation named `insertSession` in `convex/sessions.ts` that takes `sessionId` and `expiresAt` as arguments and inserts a new session.\n- Create a query named `getSessions` in `convex/sessions.ts` that returns all sessions.\n- Create a mutation named `clearExpired` in `convex/sessions.ts` that deletes all sessions where `expiresAt` is less than the current time (`Date.now()`).\n- Define a cron job in `convex/crons.ts` named `clear expired sessions` that runs the `clearExpired` mutation every hour.\n- Deploy the Convex functions to the cloud using `npx convex deploy`.\n\n## Implementation Hints\n- Set up a basic Node.js project and install `convex`.\n- You can configure the project by manually creating `convex.json` and the `convex/` folder.\n- Use `CONVEX_DEPLOY_KEY` in your environment to authenticate for `npx convex deploy`.\n- In `convex/sessions.ts`, write the mutations and queries.\n- In `convex/crons.ts`, use `crons.hourly()` to schedule the mutation.\n\n## Acceptance Criteria\n- Project path: `/home/user/project`\n- The cloud instance must have the `sessions` table, the `insertSession` mutation, the `getSessions` query, the `clearExpired` mutation, and the cron job deployed.\n- The `insertSession` mutation must successfully insert a session.\n- The `getSessions` query must return all inserted sessions.\n- The `clearExpired` mutation must successfully delete sessions with `expiresAt \u003c Date.now()` and leave other sessions intact.\n- The cron job must be defined in `convex/crons.ts` to run hourly.\n"])</script><script>self.__next_f.push([1,"a:T73b,"])</script><script>self.__next_f.push([1,"# Convex Basic CRUD\n\n## Background\nConvex is a reactive backend-as-a-service. In this task, you will create a simple task manager backend using Convex, define a schema with validation and indexes, and deploy it.\n\n## Requirements\n- Create a Node.js project in `/home/user/myproject` and install `convex`.\n- Read the `run-id` from the `ZEALT_RUN_ID` environment variable.\n- Define a schema in `convex/schema.ts` with a table named `tasks_${run-id}`.\n- The table must have two fields: `text` (string) and `status` (a union of literal \"todo\" and literal \"done\").\n- Add an index named `by_status` on the `status` field of this table.\n- Create a file `convex/tasks.ts` and define a mutation named `create` that takes a `text` string argument, inserts a new record into the `tasks_${run-id}` table with `text` and `status: \"todo\"`, and returns the new record's ID.\n- In the same file, define a query named `get` that takes a `status` string argument and returns all records from the `tasks_${run-id}` table matching that status, using the `by_status` index.\n- Deploy the Convex project and save the deployment output to `/home/user/myproject/deploy.log`.\n\n## Implementation Hints\n- Set up a basic `package.json` and install the `convex` package.\n- You will need to dynamically generate `convex/schema.ts` and `convex/tasks.ts` to include the `run-id` in the table name.\n- The `CONVEX_DEPLOY_KEY` environment variable is already available in the environment for deployment.\n- Use `npx convex deploy` to push your schema and functions to the Convex cloud. Redirect its output to `deploy.log`.\n\n## Acceptance Criteria\n- Project path: `/home/user/myproject`\n- Log file: `/home/user/myproject/deploy.log`\n- The deployed Convex backend must expose a mutation `api.tasks.create` and a query `api.tasks.get`.\n- The table name must strictly match `tasks_${run-id}`.\n\n"])</script><script>self.__next_f.push([1,"b:T919,"])</script><script>self.__next_f.push([1,"# Convex Transaction: Bank Transfer\n\n## Background\nConvex is a reactive backend-as-a-service where mutations are inherently transactional and deterministic. You need to implement a bank transfer mutation that ensures atomicity across multiple table updates.\n\n## Requirements\n- Initialize a Convex project in `/home/user/project`.\n- Define a schema with an `accounts` table. Each account must have a `name` (string) and a `balance` (number).\n- Implement a mutation `createAccount` in `convex/bank.ts` that takes `name` (string) and `initialBalance` (number) and returns the new account ID.\n- Implement a query `getAccount` in `convex/bank.ts` that takes `accountId` (ID) and returns the account object.\n- Implement a mutation `transfer` in `convex/bank.ts` that takes `from` (account ID), `to` (account ID), and `amount` (number).\n- The `transfer` mutation must:\n  - Check if both accounts exist.\n  - Check if the `from` account has at least `amount` balance. If not, throw an error.\n  - Deduct `amount` from the `from` account.\n  - Add `amount` to the `to` account.\n- Deploy the project to the Convex cloud.\n\n## Implementation Hints\n- Use `defineSchema` and `defineTable` in `convex/schema.ts` to define the `accounts` table.\n- Use `mutation` and `query` from `./_generated/server` in `convex/bank.ts`.\n- Use `ctx.db.get` to fetch accounts, and `ctx.db.patch` to update balances.\n- Convex mutations are automatically atomic, so you don't need explicit transaction locks.\n- Make sure to add `@types/node` if you use Node built-ins, but it's not needed for basic mutations.\n- Ensure you run `npx convex deploy` to push your functions to the Convex cloud.\n- Read the `ZEALT_RUN_ID` environment variable and use it if you need to name any global resources, though account IDs will be unique.\n\n## Acceptance Criteria\n- Project path: `/home/user/project`\n- The Convex project must be deployed and accessible via `npx convex run`.\n- Exported Convex functions:\n  - `bank:createAccount` (mutation): args `{\"name\": \u0
