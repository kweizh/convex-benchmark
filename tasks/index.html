ckground\nYou have a Convex project initialized in `/home/user/project`. The `convex/schema.ts` file defines an `events` table (with `type` and `value` fields) and an `aggregations` table (with a `totalValue` field).\nYour task is to create a scheduled background job that aggregates data from the `events` table every hour.\n\n## Requirements\n1. **Create `convex/aggregate.ts`**:\n   - Define and export an internal mutation named `run`.\n   - The mutation takes no arguments.\n   - It should query all documents from the `events` table, calculate the total sum of the `value` field across all events, and insert a new document into the `aggregations` table with `totalValue` set to the calculated sum.\n\n2. **Create `convex/crons.ts`**:\n   - Initialize a `crons` object using `cronJobs()`.\n   - Schedule the `internal.aggregate.run` mutation to run every 1 hour using `crons.interval`.\n   - Name the interval job `\"aggregate events\"`.\n   - Export the `crons` object as the default export.\n\n## Implementation Guide\n- In `convex/aggregate.ts`, import `internalMutation` from `./_generated/server` and use the object syntax (`internalMutation({ args: {}, handler: async (ctx, args) =\u003e { ... } })`).\n- In `convex/crons.ts`, import `cronJobs` from `convex/server` and `internal` from `./_generated/api`.\n- Do not use the deprecated `crons.hourly` helper. Use `crons.interval(\"aggregate events\", { hours: 1 }, internal.aggregate.run, {})`.\n\n## Constraints\n- Project path: `/home/user/project`\n- You do not need to run the project. Just create the correct files."])</script><script>self.__next_f.push([1,"a:T56f,"])</script><script>self.__next_f.push([1,"# Convex Chat Typing Indicators\n\n## Background\nYou are building the backend for a real-time chat application using Convex. You need to implement a \"typing indicator\" feature so users can see when others are typing.\n\n## Requirements\n1. Initialize a Convex project in `/home/user/chat-app`.\n2. Define a Convex schema in er/convex-project`.\n2. Run `npx tsc` to see the circular dependency error.\n3. Refactor `convex/users.ts`, `convex/posts.ts`, and `convex/comments.ts` to break the type circularity. You can do this by using `makeFunctionReference` from `convex/server` (e.g., `makeFunctionReference(\"posts:getPostsByUser\")`) instead of importing `internal` from `_generated/api`, or by adding explicit return types to the handlers so TypeScript doesn't need to infer them circularly.\n4. Ensure `npx tsc` passes successfully with 0 exit code.\n\n## Constraints\n- Project path: `/home/user/convex-project`\n- Do not change the runtime behavior or the database schema.\n- The functions must still call each other as originally intended.\n\n## Integrations\n- None"])</script><script>self.__next_f.push([1,"c:T469,# Convex Cron Job Cleanup\n\n## Background\nYou need to set up a Convex project that includes a cron job to clean up expired session data every hour.\n\n## Requirements\n- Initialize a Node.js project in `/home/user/convex-cron`.\n- Install `convex`.\n- Create a Convex schema with a `sessions` table containing `expiresAt` (number).\n- Create an internal mutation in `convex/sessions.ts` named `cleanupExpired` that deletes all sessions where `expiresAt` is less than the current time (passed as an argument or using `Date.now()`).\n- Create a cron job in `convex/crons.ts` that runs `cleanupExpired` every hour using `crons.hourly()`.\n\n## Implementation Guide\n1. `mkdir -p /home/user/convex-cron \u0026\u0026 cd /home/user/convex-cron`\n2. `npm init -y`\n3. `npm install convex`\n4. Create `convex/schema.ts` defining the `sessions` table.\n5. Create `convex/sessions.ts` with the `cleanupExpired` internal mutation.\n6. Create `convex/crons.ts` defining the hourly cron job.\n\n## Constraints\n- Project path: /home/user/convex-cron\n- The mutation must be exported as `cleanupExpired` and use `internalMutation`.\n- The cron job must use `crons.hourly()`.d:T710,"])</script><script>self.__next_f.push([1,"# Convex Cursor-Based Pagination\n\n## Background\nConvex provides a built-in `paginate` method on database queries to fetch data in chunks using a cursor. This is essential for building scalable lists and feeds.\n\n## Requirements\n- Initialize a Convex project in `/home/user/project`.\n- Define a schema with a `messages` table containing `text` (string) and `author` (string).\n- Create a mutation to send messages.\n- Create a paginated query to list messages in descending order.\n- Write a Node.js script that populates the database and tests the pagination, saving the results to a JSON file.\n\n## Implementation Guide\n1. Initialize a Node.js project in `/home/user/project` and install `convex` and `dotenv`.\n2. Create `convex/schema.ts` defining a `messages` table with `text: v.string()` and `author: v.string()`.\n3. Create `convex/messages.ts` with:\n   - A `send` mutation taking `text` and `author`.\n   - A `list` query taking `paginationOpts: paginationOptsValidator` and returning `ctx.db.query(\"messages\").order(\"desc\").paginate(args.paginationOpts)`.\n4. Create `/home/user/project/test_pagination.js` that uses `ConvexHttpClient` to:\n   - Call the `send` mutation 5 times with different messages.\n   - Call the `list` query with `paginationOpts: { numItems: 2, cursor: null }`.\n   - Call the `list` query again using the `continueCursor` from the first result and `numItems: 2`.\n   - Write an object containing `page1` (first result page array) and `page2` (second result page array) to `/home/user/project/output.json`.\n\n## Constraints\n- Project path: `/home/user/project`\n- Log file: `/home/user/project/output.json`\n- You must deploy your Convex functions using `npx convex deploy`.\n- Ensure you configure the client in your script with the `CONVEX_URL` environment variable.\n\n## Integrations\n- None"])</script><script>self.__next_f.push([1,"e:T46a,# Convex Data Migration Script\n\n## Background\nYou have a Convex project initialized at `/home/ e message to the database.\n- Create the `saveMessage` mutation in the same file, which accepts `text` (string) and inserts into the `messages` table.\n- Remove the original `sendMessage` mutation.\n- Ensure the code passes `npx tsc` (type checks).\n\n## Constraints\n- Project path: `/home/user/myproject`\n- Use `https://httpstat.us/200` for the external API call to avoid real side effects while still performing a real fetch.\n- Do not use `use node` directive, keep it in the default Convex runtime.\n- Use Convex `v` validator for arguments."])</script><script>self.__next_f.push([1,"10:T6f5,"])</script><script>self.__next_f.push([1,"# Convex HTTP Webhooks\n\n## Background\nConvex allows you to define HTTP actions to handle incoming webhooks from external services. In this task, you will create a Convex backend that receives a POST request and stores the data.\n\n## Requirements\n- Initialize a Convex project in `/home/user/project`.\n- Define a schema (`convex/schema.ts`) with a `messages` table containing `author` (string) and `body` (string).\n- Create a mutation `sendMessage` in `convex/messages.ts` that inserts a message into the `messages` table.\n- Create an HTTP action at `POST /webhook` in `convex/http.ts` that reads a JSON payload containing `author` and `body`, calls the `sendMessage` mutation, and returns a 200 response.\n- Save the Convex site URL (e.g., `https://\u003cdeployment-name\u003e.convex.site`) to `/home/user/project/convex_site_url.txt`.\n\n## Implementation Guide\n1. The project directory `/home/user/project` is already created with `package.json` and `convex` installed.\n2. Write `convex/schema.ts` to define the `messages` table.\n3. Write `convex/messages.ts` defining the `sendMessage` mutation.\n4. Write `convex/http.ts` defining the HTTP action and routing `POST /webhook` to it.\n5. Deploy the Convex functions using `npx convex deploy`.\n6. Determine your deployment's site URL and save it to `/home/user/project/convex_site_url.txt`.\n\n## Constraints\n- Project path: `/home/user/project`\n- You must use `npx convex deploy` to push your code. The `CONVEX_DEPLOY_KEY` is already provided in the environment.\n- The payload format for the webhook is `{\"author\": \"Alice\", \"body\": \"Hello\"}`.\n- Do not use `npx convex dev` as it is interactive.\n- The file `/home/user/project/convex_site_url.txt` must contain exactly the base URL (no trailing slash, e.g., `https://happy-animal-123.convex.site`)."])</script><script>self.__next_f.push([1,"11:T4c4,# Convex Optimistic Updates in React\n\n## Background\nConvex provides a powerful `.withOptimisticUpdate` feature to update the UI instantly before a mutation completes. This makes applications feel extremely fast and responsive.\n\n## Requirements\nYou have a Vite React project set up at `/home/user/project` with Convex installed and initialized.\n- The schema (`convex/schema.ts`) has a `counter` table with a `value` (number).\n- There is a query `get` in `convex/counter.ts` to get the counter value.\n- There is a mutation `increment` in `convex/counter.ts` to increment the counter.\n- Your task is to update `src/App.tsx` to display the counter and have an \"Increment\" button.\n- You MUST configure the mutation with `.withOptimisticUpdate` to immediately update the local query result before the server responds.\n\n## Implementation Guide\n1. Review `convex/schema.ts` and `convex/counter.ts` to understand the backend.\n2. In `src/App.tsx`, use `useQuery` to fetch the counter and `useMutation` for the increment.\n3. Configure the mutation with `.withOptimisticUpdate` to update the `localStore` immediately.\n\n## Constraints\n- Project path: /home/user/project\n- The UI must render the counter value and an increment button.12:T53b,# Paginated Full-Text Search in Convex\n\n## Background\nConvex supports powerful full-text search directly within its database. You need to implement a paginated search query for a chat application's messages.\n\n## Requirements\n- D  `doWork` in `convex/actions.ts` that takes a `userId` (string). It calls the `checkAndIncrement` mutation. If the mutation returns `false`, throw an Error with message \"Rate limit exceeded\". If `true`, return \"Work completed\".\n\n## Implementation Guide\n1. Initialize a Node.js project in `/home/user/project` and install `convex`.\n2. Create `convex/schema.ts` defining the `rateLimits` table with the required index.\n3. Create `convex/rateLimit.ts` with the `checkAndIncrement` mutation.\n4. Create `convex/actions.ts` with the `doWork` action.\n\n## Constraints\n- Project path: /home/user/project\n- Do not use external rate limiting services, use the Convex database.\n- The action must be defined using the new function syntax."])</script><script>self.__next_f.push([1,"14:T4de,# Convex RBAC Mutation\n\n## Background\nImplement a simple Role-Based Access Control (RBAC) system in a Convex backend to restrict who can delete tasks.\n\n## Requirements\n1. Define a schema in `convex/schema.ts` with two tables:\n   - `users`: `{ name: v.string(), role: v.string() }`\n   - `tasks`: `{ text: v.string(), status: v.string() }`\n2. Create the following mutations in `convex/tasks.ts`:\n   - `createUser`: accepts `name: v.string()` and `role: v.string()`, inserts a user, and returns the user ID.\n   - `createTask`: accepts `text: v.string()` and `status: v.string()`, inserts a task, and returns the task ID.\n   - `deleteTask`: accepts `taskId: v.id(\"tasks\")` and `userId: v.id(\"users\")`. Inside the mutation, fetch the user. If the user does not exist or their `role` is not `\"admin\"`, it must throw an Error with the exact message `\"Unauthorized\"`. If the user is an admin, delete the task using `ctx.db.delete(args.taskId)`.\n\n## Implementation Guide\n1. Initialize a Convex project in `/home/user/project` if not already initialized.\n2. Write the schema in `convex/schema.ts`.\n3. Write the mutations in `convex/tasks.ts`.\n\n## Constraints\n- Project path: `/home/user/project`\n- Use `v.id(\"tasks\")` and `v.id(\"users\")` for the arguments.15:T606,"])</script><script>self.__next_f.push([1,"# Real-time Collaborative Cursor with Convex\n\n## Background\nCreate a real-time collaborative cursor application using Convex and React (Vite).\n\n## Requirements\n- Define a `cursors` table in `convex/schema.ts` with `id` (string), `x` (number), `y` (number), and `color` (string).\n- Create a mutation `update` in `convex/cursors.ts` that takes `id`, `x`, `y`, and `color`. It should update the cursor if `id` exists, or insert it if not.\n- Create a query `get` in `convex/cursors.ts` that returns all cursors.\n- In `src/App.jsx`, render a full-screen `div` that listens to `onMouseMove`. Call the `update` mutation with a unique ID (e.g., 'user1'), the mouse `x` and `y`, and a color (e.g., 'red').\n- Fetch all cursors using the `get` query and render them as `div` elements with `class=\"cursor\"` at their respective `x` and `y` coordinates.\n\n## Implementation Guide\n1. The project at `/home/user/cursor-app` is a Vite React app with Convex installed.\n2. Run `npx convex deploy` to deploy your Convex backend (the `CONVEX_DEPLOY_KEY` is provided in the environment).\n3. Implement the schema and functions in the `convex/` directory.\n4. Update `src/main.jsx` to wrap the app in `ConvexProvider` using `import { ConvexProvider, ConvexReactClient } from \"convex/react\";` and `new ConvexReactClient(import.meta.env.VITE_CONVEX_URL)`.\n5. Update `src/App.jsx` to implement the frontend logic.\n6. Ensure `npm run dev` starts the frontend on port 5173.\n\n## Constraints\n- Project path: `/home/user/cursor-app`\n- Start command: `npm run dev`\n- Port: 5173"])</script><script>self.__next_f.push([1,"16:T544,# Convex Relational Queries\n\n## Background\nConvex is a reactive database where queries are written in TypeScript. In this task, you will implement a relational query that joins data from two tables: `users` and `messages`.\n\n## Requirements\n- Define a schema in `convex/schema.ts` with two tables: `users` (has a `name` string field) and `messages` (has a `text` string field, and an `authorId` field referencing `users`).\n- Implement a query `listMessages` in `convex/messages.ts` that fetches all messages and also fetches the author for each message, returning an array of objects containing the message and its author's name.\n\n## Implementation Guide\n1. The project is already initialized at `/home/user/project` with `convex` and `typescript` installed. The `convex` folder exists.\n2. Create `convex/schema.ts` defining the `users` and `messages` tables.\n3. Create `convex/messages.ts` and implement the `listMessages` query.\n   - The query should take no arguments.\n   - It should return an array of objects, each containing the `_id` of the message, the `text` of the message, and the `authorName` (the name of the user referenced by `authorId`).\n\n## Constraints\n- Project path: `/home/user/project`\n- Use the new function syntax for Convex functions.\n- Ensure `convex/schema.ts` and `convex/messages.ts` are syntactically correct TypeScript.17:T489,# Soft Delete Pattern in Convex\n\n## Background\nImplement a soft delete pattern in a Convex project to keep data for auditing while hiding it from normal queries.\n\n## Requirements\n- Define a schema for a `documents` table that supports soft deletion.\n- Implement a mutation to create a document.\n- Implement a mutation to soft delete a document.\n- Implement a query to list only active (non-deleted) documents using an index.\n\n## Implementation Guide\n1. In `/home/user/project/convex/schema.ts`, define a `documents` table with `title` (v.string()) and `isDeleted` (v.boolean()). Add an index named `by_deleted` on `[\"isDeleted\"]`.\n2. In `/home/user/project/convex/documents.ts`, export a `create` mutation that takes `title` (v.string()) and inserts a document with `title` and `isDeleted: false`. Return the ID.\n3. Export a `softDelete` mutation that takes `id` (v.id(\"documents\")) and updates `isDeleted` to `true`.\n4. Export a `listActive` query that uses the `by_deleted` index to return all documents where `isDeleted` is `false`.\n\n## Constraints\n- Project path: /home/user/project\n- Use `v.string()`, `v.boolean()`, and `v.id(\"documents\")` for validation.18:T633,"])</script><script>self.__next_f.push([1,"# Convex Vector Search with Filtering\n\n## Background\nConvex supports vector search with the ability to filter results based on additional fields. This is useful for finding similar items within a specific category, such as finding similar foods within a specific cuisine.\n\n## Requirements\n- Define a `foods` table schema in `convex/schema.ts` with:\n  - `description`: string\n  - `cuisine`: string\n  - `embedding`: array of float64\n  - A vector index named `by_embedding` on the `embedding` field with 4 dimensions and filtering on `cuisine`.\n- Create an internal query `fetchResults` in `convex/foods.ts` that takes an array of `foods` IDs (`ids: v.array(v.id(\"foods\"))`) and returns the corresponding documents.\n- Create an action `similarFoods` in `convex/foods.ts` that takes a `vector` (array of float64) and a `cuisine` (string), performs a vector search on the `by_embedding` index using `ctx.vectorSearch` with the provided vector and filters by the provided cuisine (exact match), and then fetches the full documents using the `fetchResults` query.\n\n## Implementation Guide\n1. Initialize a Node.js project in `/home/user/project`.\n2. Install `convex`.\n3. Create `convex/schema.ts` and define the `foods` table and vector index.\n4. Create `convex/foods.ts` and implement the `fetchResults` internal query and `similarFoods` action.\n\n## Constraints\n- Project path: `/home/user/project`\n- The `similarFoods` action should accept the vector directly as an argument `args: { vector: v.array(v.float64()), cuisine: v.string() }`.\n- Do not call any external embedding API in the action."])</script><script>self.__next_f.p
